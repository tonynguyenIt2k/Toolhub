<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004ac6" />
      <stop offset="50%" stop-color="#1a64e8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Hub Icon Graphic in Center -->
  <g transform="translate(106, 106) scale(12.5)" fill="#ffffff" filter="url(#shadow)">
    <!-- Central Hub Circle -->
    <circle cx="12" cy="12" r="3.2" fill="#ffffff" />
    <!-- Outer Node Circles -->
    <circle cx="12" cy="4" r="2.2" fill="#ffffff" />
    <circle cx="4" cy="12" r="2.2" fill="#ffffff" />
    <circle cx="20" cy="12" r="2.2" fill="#ffffff" />
    <circle cx="12" cy="20" r="2.2" fill="#ffffff" />
    <!-- Connection Lines -->
    <path d="M12 6.2 L12 8.8 M6.2 12 L8.8 12 M15.2 12 L17.8 12 M12 15.2 L12 17.8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
